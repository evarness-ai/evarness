# Dependency-update scanning. Runtime deps are two and pinned-bounded in
# pyproject; this watches the dev/docs toolchain and the workflow actions.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
