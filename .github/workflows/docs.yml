name: docs

# Builds the site on every push/PR (including the demos hook, which runs the
# real CLI and fails the build if the reference digests don't reproduce —
# the docs cannot publish a claim the build didn't demonstrate).
# Deployment is gated on repository visibility: GitHub Pages needs a public
# repo on this plan, so the deploy job is skipped while private and starts
# publishing automatically from the first push after the repo flips public.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (package + pinned docs toolchain)
        run: python -m pip install -e ".[docs]"
      - name: Build site (demos generated by the CLI, digests checked)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
