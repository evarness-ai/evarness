# Docs site — MkDocs Material, confined to the [docs] extra (build-time only,
# never in the wheel). Pages include the canonical markdown via snippets, so
# GitHub and the site render the same files: there is no forked prose.
# The demos hook (docs/hooks/demos.py) generates the live artifacts by running
# the CLI at build time and FAILS THE BUILD if the reference digests don't
# reproduce — the docs cannot claim what the build didn't demonstrate.

site_name: Evarness
site_description: Prove an AI agent harness before it touches real data.
site_url: https://evarness-ai.github.io/evarness/
repo_url: https://github.com/evarness-ai/evarness
repo_name: evarness-ai/evarness
edit_uri: blob/main/docs/

docs_dir: docs
exclude_docs: |
  hooks/
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - toc.follow

extra_css:
  - stylesheets/brand.css

# the blog is part of the same gated build (E17): Material's built-in blog
# plugin, no new dependency; declaring plugins disables the defaults, so
# search is re-added explicitly
plugins:
  - search
  - blog:
      authors: false

# note: canonical-file inclusion (the `--8<--` lines in wrapper pages) is
# handled by the demos hook, which also rewrites repo-relative links to their
# site-context targets before MkDocs validates them
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

hooks:
  - docs/hooks/demos.py

nav:
  - Home: index.md
  - Get started:
      - Live demos: demos.md
      - User guide: GUIDE.md
      - End-to-end walkthrough: E2E.md
  - Learn:
      - Prove & verify: PROVE-VERIFY.md
      - Architecture: architecture.md
  - Extend:
      - Your first node: tutorial-custom-node.md
      - Build a domain plugin: tutorial-domain-plugin.md
  - Project:
      - Contributing: contributing.md
      - Security: security.md
      - Developer onboarding: ONBOARDING.md
      - Decision log: decisions.md
  - Blog:
      - blog/index.md
