[project]
name = "evarness"
version = "0.2.4"
description = "The governed agent harness for small local models. It proves what it did."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Evarness contributors" }]
# 3.13 supported since 2026-09-26: the core has no 3.12-only code; what held it back was
# numpy<2 (no cp313 wheels) and heavy dependencies nothing imported.
requires-python = ">=3.12,<3.14"
keywords = ["ai", "llm", "agent", "harness", "governance", "privacy", "ollama", "local-first", "mcp", "plugins"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Scheduling",
    "Environment :: Console",
    "Environment :: Web Environment",
]
# The dependency table stays Poetry's ([tool.poetry.dependencies]: caret constraints and
# the optional markers the extras name), which PEP 621 spells by listing dependencies
# here as dynamic. Everything else about the package is in this table, so uv, pip and any
# PEP 621 reader see a project: `uv sync` in a clone used to resolve an empty workspace
# and install nothing (#373).
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/evarness-ai/evarness"
Repository = "https://github.com/evarness-ai/evarness"
Documentation = "https://evarness-ai.github.io/evarness/"
"Bug Tracker" = "https://github.com/evarness-ai/evarness/issues"
Changelog = "https://github.com/evarness-ai/evarness/blob/main/CHANGELOG.md"

[project.scripts]
evarness = "evarness.main:main"

# The domain plugins, discovered exactly as a third-party plugin is: by the
# `evarness.plugins` entry-point group, with their manifest.yaml read from beside
# the module named here (OSS plan M6, decisions 2 and 10). The public tree ships the
# email slice's three (R2) -- the email profile mounts them; `default` names none -- and
# the fenced four stay private until release 2.
[project.entry-points."evarness.plugins"]
email_workflows = "evarness_personal.plugins.email_workflows.plugin:setup"
gmail = "evarness_personal.plugins.gmail.plugin:setup"
imap = "evarness_personal.plugins.imap.plugin:setup"

[project.optional-dependencies]
# The email assistant (OSS plan R2/R6), declared in the public tree only: here the Google
# packages are main dependencies already (see the dependency table), and an extra that
# names a main dependency would make it extra-only in the wheel.
# The versions repeat the dependency table's optional entries below, which carry the
# same constraints for the lock: this table is what the wheel's Requires-Dist reads.
email = ["google-api-python-client>=2.0,<3.0", "google-auth>=2.0,<3.0", "google-auth-oauthlib>=1.0,<2.0", "scikit-learn>=1.3"]
ml = ["sentence-transformers>=5.5.1,<6.0"]
all = ["sentence-transformers>=5.5.1,<6.0", "google-api-python-client>=2.0,<3.0", "google-auth>=2.0,<3.0", "google-auth-oauthlib>=1.0,<2.0", "scikit-learn>=1.3"]

[tool.poetry]
# What PEP 621 cannot say: where the packages are, what else ships, and what stays out.
packages = [
    { include = "evarness", from = "src" },
    { include = "memris", from = "src" },  # the memory-graph engine, public (ADR-0115 decision 10)
    # The repo's config/ tree, shipped as package data at evarness/_data/config/ so
    # a plain `pip install` has its defaults. Mapped, not copied: git holds one config/.
    # foundation/paths.py config_dir() finds it when there is no checkout to read.
    { include = "config", to = "evarness/_data" },
    # The domains (M6.1b, decision 2). Public since release 1 for the email slice only
    # (R2): the export cuts src/evarness_personal to email/, connections/ and the email
    # plugins (scripts/oss_public_slice.txt), and this one entry packages what is there.
    { include = "evarness_personal", from = "src" },
    # The 0.1.x import names, as shims that resolve to the packages above with a
    # deprecation warning (src/evarness/foundation/legacy.py). Removed in 0.3.0.
    { include = "iris_harness", from = "src" },
    { include = "iris_personal", from = "src" },
]
include = [
    # The domain plugins' manifests: the loader reads manifest.yaml beside the module
    # an entry point names, so a wheel without them loads plugins that register nothing.
    { path = "src/evarness_personal/plugins/**/*.yaml", format = ["sdist", "wheel"] },
    { path = "src/evarness/plugins_builtin/**/*.yaml", format = ["sdist", "wheel"] },
    # The web console's production build (OSS plan R6). Gitignored, so it ships only
    # when named here: the release workflow fills it (scripts/bundle_webui.py) before
    # the build, and static_ui.resolve_webui_dist() serves it from the installed package.
    { path = "src/evarness/server/harness_api/webui_dist/**/*", format = ["sdist", "wheel"] },
]
# What the packaged config/ leaves out. Agent working notes never ship. The public-line
# entries become live in the public pyproject only (scripts/oss_strip_private.sh): the
# private domains' config, their skill packs, the coding agent's config and the
# usage-derived skill proposals are private by purpose, so the public wheel carries none
# of them even if the exported tree ever has the files. The private wheel keeps them,
# because it ships evarness_personal and iris_code, which read them. The email skill packs
# (config/skills/email) ship: they import only the email slice (R2).
exclude = [
    "config/**/CLAUDE.md",
"config/coding-agent/**/*",
"config/filemanager/**/*",
"config/finance/**/*",
"config/finance_alerts.yaml",
"config/market.yaml",
"config/skills/auto/**/*",
"config/skills/calendar/**/*",
"config/skills/calendar-reminders/**/*",
"config/skills/filemanager/**/*",
"config/skills/finance/**/*",
"config/skills/planner/**/*",
"config/skills/research/research-draft/**/*",
]

[tool.poetry.dependencies]
# LangChain: the only parts the code imports. `langchain_core.tools.BaseTool` is every
# tool's base class (skills, MCP bridge, research); the two chat clients are llm/client.py's
# (lazily). 1.x since 2026-09-26, which the private coding agent's langgraph 1.x needs.
langchain-core = "^1.6"
langchain-openai = "^1.6"
langchain-ollama = "^1.1"

# Core
pydantic = "^2.0"
httpx = ">=0.27,<1"
# Imported directly by runtime/egress_transport.py (PinnedTransport swaps httpx's private
# connection pool for one that connects to a vetted address). httpx pulls it in, but a direct
# import must be a declared dependency; tests/.../test_egress_httpx_internals.py pins the seam.
httpcore = ">=1,<2"
fastapi = ">=0.109,<1"
# Pinned directly (fastapi allows >=0.46): 1.0.0 rebuilt request.url from the Host
# header, which let a crafted Host move a request onto an auth-exempt path
# (PYSEC-2026-161). The code no longer trusts request.url for that either.
starlette = ">=1.3.1,<2"
uvicorn = ">=0.27,<1"  # runs every server (Dockerfile, compose, `evarness serve`)
pyyaml = "^6.0"
python-dotenv = "^1.2.1"
numpy = ">=1.26"
psutil = "^6.0.0"
prompt_toolkit = ">=3.0"

# Auth & Security
pyjwt = "^2.13"
cryptography = ">=43,<51"
keyring = "^25.0.0"

# Vector DB & RAG
chromadb = ">=0.5.0"

# Uploads: FastAPI parses UploadFile/File with it (POST /rag/upload); never imported.
python-multipart = ">=0.0.31"

# File watching
watchdog = "^4.0.0"

# Background jobs
apscheduler = "^3.10.0"

# PDF & OCR
pillow = ">=12.1.0,<14.0.0"
pytesseract = "^0.3.13"

# Observability. OpenTelemetry is core: spans export over OTLP to whatever backend the
# standard OTEL_EXPORTER_OTLP_* variables name (foundation/observability/otlp_setup.py).
# No trace UI is bundled (ADR-0128): Phoenix, Jaeger, Tempo and the rest run as the
# user's own backend.
opentelemetry-api = ">=1.20.0"
opentelemetry-sdk = ">=1.20.0"
opentelemetry-exporter-otlp = ">=1.20.0"
# httpx client spans (EVARNESS_OTEL_HTTPX_ENABLED, default on). The contrib instrumentation
# line is versioned 0.Nb and pins opentelemetry-instrumentation/semantic-conventions to
# the same 0.Nb, which match one SDK 1.x release: 0.62b1 goes with SDK 1.41.1.
opentelemetry-instrumentation-httpx = ">=0.62b1"
openinference-instrumentation-langchain = ">=0.1.0"
ddgs = "^9.14"
pyarrow = ">=15.0"
duckdb = ">=1.1,<2"
# Phase 1 Track 1E.2 — corpus-discovery embedder (per ADR-0018 §7); also backs the
# opt-in BGE reranker and the transformers threat backend. OPTIONAL extra `ml`:
# it pulls torch, and on Linux torch pulls ~5 GB of CUDA wheels, which made a
# fresh `poetry install` exceed the 45-minute CI job. Lazy-imported everywhere so
# the harness runs without it; install with `poetry install -E ml`.
sentence-transformers = {version = "^5.5.1", optional = true}
pypdfium2 = "^5.9.0"
trafilatura = "^2.1.0"
# The built-in web-fetch skill parses pages with it (config/skills/builtin/web-fetch).
# It used to arrive only through langchain-community, so it was never declared.
beautifulsoup4 = "^4.12"

# The `email` extra's packages (OSS plan R2/R19): the Google API client the Gmail
# plugin's fetcher, attachment reader and OAuth flow import. Public tree: optional, and
# `evarness[email]` installs them. Private tree: main dependencies (in the block
# below), because the calendar plugin imports them too. One line cannot be both, and an
# extra may not name a main dependency: Poetry then writes it into the wheel as
# extra-only, so a plain install would lose it. Keep the versions in step with the
# block below (tests/unit/test_scripts/test_oss_export_fences.py checks).
google-api-python-client = {version = "^2.0", optional = true}
google-auth = {version = "^2.0", optional = true}
google-auth-oauthlib = {version = "^1.0", optional = true}
# scikit-learn: HDBSCAN, which email corpus discovery clusters with -- the `discover` step
# of `evarness email setup` and the demo (OSS plan R3/R4). It was never declared: it reached
# the private venv only through sentence-transformers (the `ml` extra), so a plain
# `evarness[email]` install failed at discover (found by the export's strict pass).
# The public `email` extra declares it. The private tree still gets it only through `ml`
# (a main dependency here needs a private re-lock; see the release-1 export notes).
scikit-learn = {version = ">=1.3", optional = true}


[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
pytest-cov = "^7.1"
pytest-benchmark = "^5.3"
black = "^26.5"
ruff = "^0.16.9"
mypy = "^1.8"
pre-commit = "^4.5.1"
freezegun = "^1.5.0"
types-pyyaml = "^6.0.12.20250915"
pytest-xdist = "^3.6"
import-linter = "^2.15"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
# Explicit, and the same value ruff infers from [project].requires-python. Before the
# [project] table ruff had nothing to infer from and fell back to 3.9, which kept the
# 3.12-era UP rules off and sorted tomllib (stdlib since 3.11) as third-party.
target-version = "py312"

[tool.ruff.lint]
# BLE: a broad `except` must say why (`# noqa: BLE001 — reason`) or narrow. T20: no
# stray print() outside the CLIs that print for a living (per-file-ignores below).
# RUF100: a `# noqa` for a rule that is off or not triggered is an error, so markers
# stay honest (0.16 upgrade: 1534 such markers removed; their reasons kept as comments).
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "BLE", "T20", "RUF100"]
# UP042 and UP047 arrived with the 3.12 target. UP042 rewrites `(str, Enum)` classes to
# StrEnum, which changes what str() and format() of a member return; UP047 rewrites
# signatures to PEP 695 generics. Both are code changes to review on their own, not to
# slip in with a packaging change (#375 tracks adopting them).
ignore = ["E501", "S101", "UP042", "UP047"]

[tool.ruff.lint.isort]
# Every source root under src/, named so grouping does not depend on ruff's detection
# (0.1.x filed evarness with third-party; 0.16 detects it). memris: ADR-0115.
known-first-party = ["evarness", "evarness_personal", "iris_code", "memris"]

[tool.ruff.lint.per-file-ignores]
# test fixtures use fake tokens (S105) and sha1 for deterministic IDs (S324) — not security-relevant
"tests/*" = ["S101", "S105", "S106", "S108", "S324"]
"tests/integration/**/*.py" = ["S101", "S603", "S607"]
# the repo-script tests run our own scripts with a pinned PATH
"tests/unit/test_scripts/*.py" = ["S603", "S607"]
# The CLIs print for a living (T201): the coding agent's entry point, memris's module
# entry points, and the harness's CLI package (raw --json output bypasses rich).
"src/iris_code/cli.py" = ["T201"]
"src/memris/**/__main__.py" = ["T201"]
"src/evarness/cli/**" = ["T201"]
# The `evarness plugin new` templates are a third party's code once rendered: there
# evarness is a third-party import and the plugin's own package is first-party, the
# reverse of this repo, so their imports are grouped for the generated project (whose own
# ruff config checks them -- tests/unit/evarness/test_cli/test_plugin_scaffold.py).
"src/evarness/cli/templates/**" = ["I001"]
# The deploy scripts are CLIs (stderr is their log) and the LLM proxy logs to its
# container's stdout; both are touched only by the commit hook, not the src/ gate.
# Standalone dev harness scripts insert src/ onto sys.path before importing
# evarness.* so they run without an editable install — imports must follow that setup.
# They are CLIs too (T201: 29 of 32 print their report), checked only by the commit
# hook, so editing one no longer trips over prints it has always had.
"scripts/*" = ["E402", "T201"]
# The quickstart's first turn is a script whose output is the point (OSS plan R18).
"examples/00-quickstart/first_turn.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
# The `evarness plugin new` templates: every kind has a `__tmpl_package`, which only becomes
# a package when rendered. The rendered plugin is type-checked by its author's tooling.
exclude = ["src/evarness/cli/templates/"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "chromadb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bcrypt"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.auth.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.oauth2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "googleapiclient.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyobjc EventKit + Foundation (Apple calendar read/write) + Vision (image tagging)
# ship no type stubs; present only on macOS. Override works whether or not they are
# installed, so mypy is green on both the macOS dev box and the Linux CI runner.
module = ["EventKit", "Foundation", "Vision"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional `ml` extra (torch-backed); lazily imported, absent on CI and in the
# default install, so the type-checker must not require it either.
module = ["sentence_transformers", "sentence_transformers.*", "transformers", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "caldav.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "icalendar.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "github.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "git.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn (HDBSCAN for email corpus discovery) arrives with the optional `ml`
# extra and ships no type stubs: absent in a no-extras install, untyped where present.
# One override covers both, where an inline ignore can name only one of the two codes.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openinference.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:PydanticDeprecatedSince20:UserWarning",
    "ignore:`json_encoders` is deprecated:DeprecationWarning:pydantic._internal._generate_schema",
    'ignore:datetime.datetime.utcnow() is deprecated:DeprecationWarning',
]
# `examples/` holds the runnable examples; each carries its own test (OSS plan R18).
testpaths = ["tests", "examples"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term -m 'not real_llm and not real_embeddings and not smoke'"
markers = [
    "e2e: End-to-end integration tests",
    "integration: Integration tests",
    "performance: Performance benchmarks",
    "real_llm: Test hits a live Ollama or cloud LLM (excluded from default run)",
    "real_embeddings: Test loads ChromaDB / sentence-transformers (excluded from default run)",
    "smoke: End-to-end playground run against a real in-process runtime (excluded from default run; scripts/ci_local.sh --smoke)",
    "posix(reason): Asserts POSIX-only behaviour (file modes, fork, euid, bash scripts); skipped on Windows with the reason (tests/conftest.py)",
    "symlinks: Creates symlinks; skipped where the process may not (Windows without Developer Mode) (tests/conftest.py)",
    "minilm: Test asserts on real all-MiniLM-L6-v2 similarities (the semantic routers); runs when chromadb's copy of the model is on disk, skips otherwise (the suite never downloads it)",
]

# OSS plan release gates 1, 2 and 8 — checked by `poetry run lint-imports` in CI.
[tool.importlinter]
# The public tree has the email slice of evarness_personal (R2), so its contracts below that
# name evarness_personal hold there too; the private domains' are fenced.
root_packages = ["evarness", "memris", "evarness_personal"]

[[tool.importlinter.contracts]]
id = "memris-stands-alone"
name = "memris imports nothing from Evarness, so another project can use it on its own (ADR-0115 decision 10)"
type = "forbidden"
source_modules = ["memris"]
forbidden_modules = [
  "evarness",
  "evarness_personal",
]
# EMPTY, and it stays empty: an edge into Evarness is a design error, not burn-down.
ignore_imports = []


[[tool.importlinter.contracts]]
id = "plugins-use-the-public-api"
name = "The reference plugins import evarness.sdk and nothing else from the core (gate 2)"
type = "forbidden"
source_modules = ["evarness.plugins_builtin"]
# Direct imports only: the gate is about a plugin reaching past the SDK itself. The SDK
# re-exports from below, and chains through it are its business, not the plugin's.
allow_indirect_imports = true
# Every core package EXCEPT `evarness.sdk` (M6.2 layer 8, decision 5). A forbidden
# contract blocks only what it names, and it cannot say "all of evarness but the SDK"
# (forbidding the root forbids its child, the SDK), so a new core package would be
# silently allowed. tests/unit/test_import_contract_coverage.py closes that gap: it fails
# until every top-level evarness package but the SDK is listed here.
forbidden_modules = [
  "evarness.main",
  # M6.2 layer 10: the repo-root `services/` folder is `evarness/server/` -- the four
  # FastAPI apps ship in the wheel now, so nothing needs the repo on PYTHONPATH to import
  # them. They are listed ABOVE `cli` and `playground`, not beside them: the API serves
  # CLI-backed endpoints and runs playground scenarios, so `|` would claim an
  # independence that is not there.
  "evarness.server",
  "evarness.cli",
  "evarness.playground",
  # Stable tier, but for a plugin's TESTS: plugin code selects the fake via sdk.llm.
  "evarness.testing",
  "evarness.runtime",
  "evarness.agent",
  "evarness.services",
  "evarness.memory",
  "evarness.tools",
  "evarness.llm",
  "evarness.kernel",
  "evarness.memory.identity",
  "evarness.foundation",
  "evarness.server",
  # Plugin-capabilities step 3c: a reference plugin reaches no domain, library or plugin.
  "evarness_personal",
]
# EMPTY. The burn-down that landed with this contract at layer 8 listed 22 imports --
# each one a capability the reference plugins needed and the SDK did not publish. M6.3
# published them: sdk/{types,logging,llm,parsing,channels,health,learning,sandbox,
# identity}.py. Gate 2 is now strict in fact, not with an asterisk.
ignore_imports = []

[[tool.importlinter.contracts]]
id = "layers"
name = "The harness core is layered top-down (OSS plan M6, decision 6): each package imports only packages in the layers below it"
type = "layers"
# Today's package names in the M6 layer order. Each M6.2 slice renames entries here as
# packages move into their layer folder; the ignore list is the burn-down list — it only
# shrinks, and an empty list is a release gate (M6.3).
#
#   1 cli / server / playground   2 plugins   3 sdk   4 runtime   5 agent   6 services
#   7 memory   8 tools | llm   9 kernel   10 foundation
#
# Packages that will share ONE folder are listed as consecutive rows here, not as `|`
# siblings, because a `|` row means "independent" and these import each other today
# (main -> cli, health -> heartbeat, runtime -> core, ...). Placement notes:
#   - `identity` is `memory/identity/` since M6.3: the vault absorbed its secret stores
#     its SOUL/USER loader, which reaches up into memory, moves to agent/.
#   - `system` sits with services: status composes health signals (-> health/).
#   - tools/skills/sandbox/mcp are consecutive until they share one tools/ package; llm
#     is the sibling that neither imports nor is imported by them.
layers = [
  "evarness.main",
  # M6.2 layer 10: the repo-root `services/` folder is `evarness/server/` -- the four
  # FastAPI apps ship in the wheel now, so nothing needs the repo on PYTHONPATH to import
  # them. They are listed ABOVE `cli` and `playground`, not beside them: the API serves
  # CLI-backed endpoints and runs playground scenarios, so `|` would claim an
  # independence that is not there.
  "evarness.server",
  "evarness.cli",
  "evarness.playground",
  "evarness.plugins_builtin",
  # R16: the testing half of the stable tier (the scripted fake model, `no_network`).
  # Above the SDK and everything under it, so it may grow a harness fixture later; a
  # plugin's tests import it, a plugin's code does not (the SDK-only contracts).
  "evarness.testing",
  # M6.2 layer 8: the author-facing half of the plugin seam is `evarness.sdk` --
  # the facade a plugin imports, plus `types`, `logging` and the CLI seam. The host
  # half is `runtime/plugin_host/` (layer 7). The entry-point GROUP name stays
  # "evarness.plugins" (decision 5): it is a string, not a module.
  "evarness.sdk",
  "evarness.runtime",
  # M6.2 layer 6: the five stages are one package, `agent/`. Decision 4 also sent the
  # SOUL/USER loader here; the readers said memory instead -- it is `memory/identity/`.
  "evarness.agent",
  # M6.2 layer 5: the eleven long-lived services are one package -- health, routines,
  # learning, notifications, system status, missions, activities, rag, tasks, channels
  # and heartbeats. Five rows became one; what imports what inside the package is the
  # package's own business, as in foundation and the kernel.
  "evarness.services",
  # M6.2 layer 4 + M6.3: conversational memory, the wiki (`knowledge/`), workflow state
  # (`state/`, out of the kernel) and `identity/` (the SOUL/USER loader) are one package
  # -- everything remembered across turns (decision 4). The loader could only fold in
  # once the kernel's exfiltration guard stopped reading it directly and started asking
  # (`kernel/governance/identity_redaction.py`); it was read from both sides before.
  "evarness.memory",
  # M6.2 layer 3: tools + skills + sandbox + mcp are one package. `llm` is its sibling
  # -- neither imports the other, so they share one row.
  "evarness.tools | evarness.llm",
  # M6.2 layer 2: governance + governor are one package, the kernel. Its vault holds the
  # credential and secret stores that were `identity/`'s (decision 4); the Drive OAuth
  # flow left with the domains.
  "evarness.kernel",
  # M6.2 layer 1: persistence, observability, eventbus, data, paths -- and, since layer
  # 10, `auth.py`: the pure half of `service_common`, which the CLI and the evaluator
  # client read as well as the servers. The FastAPI middleware went up to `server/`
  # (decision 7).
  "evarness.foundation",
]
