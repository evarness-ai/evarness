# Plugin-capabilities step 3c (docs/architecture/plugin-capabilities.md §4, "No back
# door"): a plugin reaches another plugin only through the governed paths -- tools
# (`api.tools`), capabilities, events -- never by importing it. Two halves:
#   1. plugins-are-independent: no plugin package imports another plugin package, in
#      either root (the reference plugins and the domain plugins).
#   2. <domain>-imports-no-other-domain: a domain -- its library plus the plugins that
#      register over it -- imports no other domain's library. A plugin may import its own
#      library (evarness_personal/plugins/__init__.py says so). The domains:
#        email    = evarness_personal.email + evarness_personal.connections
#                   + plugins.email_workflows + plugins.gmail + plugins.imap
#        finance  = evarness_personal.finance + plugins.finance_workflows
#        files    = evarness_personal.filemanager + plugins.file_organizer
#        calendar = evarness_personal.calendar + plugins.calendar
#        planner  = plugins.planner (no library: it composes the others)
#      evarness_personal.connections (the Google reconnect routes) is part of the email slice
#      (R2): it reads email's account store, so calendar and file_organizer reach that
#      store through it (debt below, retired via credentials.accounts).
#      evarness_personal.market (a keyless quote client) is a shared library no plugin owns,
#      so importing it reaches no other plugin.
# Every ignore_imports entry is DEBT, not a permitted dependency: an exact importer ->
# imported pair (a new importer of a listed module still fails) that names what retires
# it. Rollout step 5 retires all of them before release 1; the lists only shrink, and
# end empty.
# tests/unit/test_import_contract_coverage.py fails when a new plugin or library is not
# placed in a domain below.
[[tool.importlinter.contracts]]
id = "plugins-are-independent"
name = "No plugin imports another plugin's package (plugin-capabilities step 3c)"
type = "independence"
modules = [
  "evarness.plugins_builtin.*",
  "evarness_personal.plugins.*",
]
ignore_imports = [
  # Debt to retire before release 1 via mail.read (step 4): the CLI runs without the
  # runtime, so it builds Gmail's provider itself to read bodies; it resolves the
  # capability instead.
  "evarness_personal.plugins.email_workflows.cli -> evarness_personal.plugins.gmail.provider",
]

[[tool.importlinter.contracts]]
id = "libraries-import-no-plugin"
name = "A domain library (the record) never imports a plugin (the workflows over it), directly or not"
type = "forbidden"
source_modules = [
  "evarness_personal.connections",
  "evarness_personal.email",
]
forbidden_modules = ["evarness_personal.plugins", "evarness.plugins_builtin"]
# EMPTY, and it stays empty: a library that needs a plugin has its dependency backwards.
ignore_imports = []

