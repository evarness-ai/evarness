# Email setup (OSS plan R4): the onboarding state machine's numbers and words. The code
# (onboarding.py) is mechanism only. Override from <config_dir>/email/onboarding.yaml
# (a top-level key there replaces the shipped one).

# The steps, in order, as `evarness email setup` and /api/v1/email/onboarding name them.
# Nothing touches the mailbox before `label_approval` is approved.
steps:
  connect: Connect the mailbox
  fetch: Fetch recent mail
  discover: Discover categories
  review_categories: Review the categories
  classify: Classify (the judge, then kNN)
  label_approval: Label preview and approval
  first_digest: First digest
  review_queue: Review queue
  enable_sweep: Keep it current
  summary: What Evarness just did

# How an account of each provider is connected. Setup never asks for a password or runs
# an OAuth flow itself: each provider plugin owns its login, and setup resumes after it.
# `before` is what the owner must have in hand before the login works, and `docs` the
# page of the documentation site that walks through getting it; the CLI, the API's
# overview and the web console's Setup screen all print them beside the command.
providers:
  gmail:
    connect: evarness auth gmail login --user {address}
    before: >-
      a Google Cloud OAuth client of your own (one time, about ten minutes), its JSON saved
      as workspace/credentials/google_oauth_client.json under your Evarness home
    docs: https://evarness-ai.github.io/evarness/getting-started/gmail-oauth-client/
  imap:
    connect: evarness auth imap login --user {address}
    before: >-
      an app password from your provider's security settings (iCloud, Yahoo, Fastmail and
      Gmail with 2-Step Verification offer one; Outlook.com and Microsoft 365 do not)
    docs: https://evarness-ai.github.io/evarness/getting-started/connect-your-mailbox/
  # The synthetic mailbox (`evarness email demo`); only inside a demo home, never the
  # owner's own profile.
  demo:
    connect: ""

fetch:
  # The first fetch: the newest this-many messages, from at most this many days back.
  # The scheduled sweep takes it from there.
  max_messages: 500
  cold_start_days: 90

discover:
  # Fewer emails than this and discovery is skipped (clusters would be noise); the
  # owner can run `evarness email bootstrap-categories` once more mail has arrived.
  min_corpus: 40
  # Subjects shown per proposed category in the review.
  samples: 3

classify:
  # Emails the judge reads in setup (null: EVARNESS_EMAIL_JUDGE_MAX). The rest wait for the
  # scheduled judge runs, hidden until judged.
  judge_limit: null
  # Released emails the kNN classifier files in setup.
  knn_limit: 500

label_approval:
  # Sample subjects per label in the preview.
  samples: 3
  # The approval-queue row: its signal, and how long it waits for the owner before it
  # lapses (setup then asks again).
  signal: email.mailbox_writes
  timeout_minutes: 10080
  # Shown on the approval card and in the preview; {account} is the account id.
  title: "Let Evarness label mail in {account}"
  never: Evarness never archives, never marks read and never deletes on its own.
  revoke: "Take it back any time: evarness email writes revoke --account {account}"

review_queue:
  # Unsure emails listed in the review step.
  samples: 5
